name: Bug report
description: Report a problem with Griffel
labels: ["bug"]
body:
  - type: checkboxes
    id: cleanroom
    attributes:
      label: Clean-room declaration (required)
      description: |
        Griffel is developed clean-room from the specification in `docs/` — see
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). Please confirm:
      options:
        - label: I declare that I have never read, studied, or otherwise accessed the source code, assets, or any other implementation material of Apostrophe, and that this report contains nothing derived from them.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen instead? If describing behavior of another editor, cite its public documentation rather than its source.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Griffel version
      description: Output of `griffel --version`
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: How is Griffel installed?
      options:
        - Flatpak
        - deb (Debian/Ubuntu)
        - RPM (Fedora)
        - Pacman/AUR (Arch)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Desktop session
      options:
        - Wayland (GNOME)
        - Wayland (other)
        - X11
        - Other / don't know
    validations:
      required: false
