[package]
name = "griffel"
version = "0.1.0-beta.2"
edition = "2024"

[dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.42"
gio = "0.21"
glib = "0.21"
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_12"] }
pango = "0.21"
gdk = { package = "gdk4", version = "0.10" }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
sourceview5 = { version = "0.10", features = ["v5_4"] }
unicode-segmentation = "1.13.3"
libc = "0.2"
webkit6 = { version = "0.5", features = ["v2_42"] }
